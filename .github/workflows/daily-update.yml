name: 每日热搜更新

on:
  schedule:
    # 北京时间每天早上 7:00 运行
    - cron: '0 23 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-hot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 抓取热搜
        run: python .github/scripts/fetch_hot.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hot.json data/weekly_menu.json data/weekly_exercise.json data/daily_read.json data/daily_words.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 每日数据自动更新 $(date +%Y-%m-%d)"
            git push
          fi
